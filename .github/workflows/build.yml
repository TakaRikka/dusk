name: Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, for example v1.2.3"
        required: true
        type: string
      release_name:
        description: "Release title. Defaults to the tag name."
        required: false
        type: string
      draft:
        description: "Create or update the release as a draft"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Mark the release as a prerelease"
        required: false
        type: boolean
        default: false
      make_latest:
        description: "Mark this release as latest"
        required: false
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  build-linux:
    name: Build Linux (${{matrix.name}})
    runs-on: ${{matrix.runner}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC x86_64
            runner: ubuntu-24.04
            preset: gcc
            artifact_arch: x86_64
          - name: GCC aarch64
            runner: ubuntu-24.04-arm
            preset: gcc
            artifact_arch: aarch64
          # - name: Clang x86_64
          #   runner: ubuntu-latest
          #   preset: clang
          #   artifact_arch: x86_64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch Aurora
        run: git -C extern/aurora apply ../../ci/patches/aurora-rmlui-translate-callback.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build clang lld mold openssl libcurl4-openssl-dev \
            zlib1g-dev libglu1-mesa-dev libdbus-1-dev libvulkan-dev libxi-dev libxrandr-dev libasound2-dev \
            libpulse-dev libudev-dev libpng-dev libncurses5-dev libx11-xcb-dev libfreetype-dev \
            libxinerama-dev libxcursor-dev python3-markupsafe libgtk-3-dev libssl-dev \
            libxss-dev libfuse2 libusb-1.0-0-dev libdecor-0-dev libpipewire-0.3-dev libunwind-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Print sccache stats
        run: sccache --show-stats

      - name: Configure CMake
        run: cmake --preset x-linux-ci-${{matrix.preset}}

      - name: Build
        run: cmake --build --preset x-linux-ci-${{matrix.preset}}

      - name: Generate AppImage
        run: ci/build-appimage.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.DUSK_VERSION}}-linux-${{matrix.preset}}-${{matrix.artifact_arch}}
          path: |
            build/install/Dusklight-*.AppImage
            build/install/debug.tar.*

  build-apple:
    name: Build Apple (${{matrix.name}})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppleClang macOS arm64
            platform: macos
            preset: x-macos-ci-arm64
            artifact_name: macos-appleclang-arm64
          - name: AppleClang iOS arm64
            platform: ios
            preset: x-ios-ci
            artifact_name: ios-appleclang-arm64
          # - name: AppleClang tvOS arm64
          #   platform: tvos
          #   preset: x-tvos-ci
          #   artifact_name: tvos-appleclang-arm64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch Aurora
        run: git -C extern/aurora apply ../../ci/patches/aurora-rmlui-translate-callback.patch

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Install Rust iOS target
        if: matrix.platform == 'ios'
        run: |
          rustup toolchain install stable
          rustup target add aarch64-apple-ios

      - name: Install Rust tvOS target
        if: matrix.platform == 'tvos'
        run: |
          rustup toolchain install nightly
          rustup target add --toolchain nightly aarch64-apple-tvos

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset ${{matrix.preset}}

      - name: Build
        run: cmake --build --preset ${{matrix.preset}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.DUSK_VERSION}}-${{matrix.artifact_name}}
          path: |
            build/install/Dusklight.app
            build/install/debug.tar.*

  build-android:
    name: Build Android (${{matrix.name}})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang arm64-v8a
            preset: x-android-ci-arm64
            abi: arm64-v8a
            artifact_arch: arm64
            rust_target: aarch64-linux-android

    env:
      ANDROID_NDK_VERSION: "29.0.14206865"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch Aurora
        run: git -C extern/aurora apply ../../ci/patches/aurora-rmlui-translate-callback.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Rust Android target
        run: |
          rustup toolchain install stable
          rustup target add ${{matrix.rust_target}}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset ${{matrix.preset}}

      - name: Build native library
        run: cmake --build --preset ${{matrix.preset}} --target dusklight

      - name: Stage stripped JNI library
        run: ANDROID_STAGE_ABIS="${{matrix.abi}}" platforms/android/scripts/stage-jni-libs.sh

      - name: Build APK
        working-directory: platforms/android
        env:
          DUSK_ANDROID_KEYSTORE_BASE64: ${{ secrets.DUSK_ANDROID_KEYSTORE_BASE64 }}
          DUSK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DUSK_ANDROID_KEYSTORE_PASSWORD }}
          DUSK_ANDROID_KEY_ALIAS: ${{ secrets.DUSK_ANDROID_KEY_ALIAS }}
          DUSK_ANDROID_KEY_PASSWORD: ${{ secrets.DUSK_ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --rerun-tasks

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.DUSK_VERSION}}-android-${{matrix.artifact_arch}}
          path: platforms/android/app/build/outputs/apk/release/app-${{matrix.abi}}-release.apk
          compression-level: 0

  build-windows:
    name: Build Windows (${{matrix.name}})
    runs-on: ${{matrix.runner}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC x86_64
            runner: windows-latest
            preset: msvc
            msvc_arch: amd64
            vcpkg_arch: x64
            artifact_arch: x86_64
          # - name: Clang x86_64
          #   runner: windows-latest
          #   preset: clang
          #   msvc_arch: amd64
          #   vcpkg_arch: x64
          #   artifact_arch: x86_64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch Aurora
        run: git -C extern/aurora apply ../../ci/patches/aurora-rmlui-translate-callback.patch

      - name: Enable Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      # msvc-dev-cmd sets VCPKG_ROOT, set it back
      - name: Override VCPKG_ROOT
        run: echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install dependencies
        run: |
          choco install ninja
          vcpkg install freetype:${{matrix.vcpkg_arch}}-windows zstd:${{matrix.vcpkg_arch}}-windows

      - name: Configure CMake
        run: cmake --preset x-windows-ci-${{matrix.preset}}

      - name: Build
        run: cmake --build --preset x-windows-ci-${{matrix.preset}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.DUSK_VERSION}}-win32-msvc-${{matrix.artifact_arch}}
          path: |
            build/install/*.exe
            build/install/*.dll
            build/install/res/
            build/install/debug.7z

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-apple
      - build-android
      - build-windows
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          while IFS= read -r -d '' artifact_dir; do
            artifact_name="$(basename "$artifact_dir")"

            if find "$artifact_dir" -mindepth 1 -type d -print -quit | grep -q .; then
              if [[ "$artifact_name" == *-win32-* || "$artifact_name" == *-windows-* ]]; then
                (cd "$artifact_dir" && zip -qr "$GITHUB_WORKSPACE/release-assets/${artifact_name}.zip" .)

                portable_dir="$(mktemp -d)"
                cp -a "$artifact_dir"/. "$portable_dir"/
                : > "$portable_dir/portable.txt"
                (cd "$portable_dir" && zip -qr "$GITHUB_WORKSPACE/release-assets/${artifact_name}-portable.zip" .)
                rm -rf "$portable_dir"
                continue
              fi

              tar -C "$artifact_dir" -czf "release-assets/${artifact_name}.tar.gz" .

              if [[ "$artifact_name" != *-android-* && "$artifact_name" != *-ios-* && "$artifact_name" != *-tvos-* ]]; then
                portable_dir="$(mktemp -d)"
                cp -a "$artifact_dir"/. "$portable_dir"/
                : > "$portable_dir/portable.txt"
                tar -C "$portable_dir" -czf "release-assets/${artifact_name}-portable.tar.gz" .
                rm -rf "$portable_dir"
              fi

              continue
            fi

            while IFS= read -r -d '' item; do
              cp "$item" "release-assets/${artifact_name}-$(basename "$item")"
            done < <(find "$artifact_dir" -mindepth 1 -type f -print0)

            if [[ "$artifact_name" == *-linux-* ]]; then
              portable_dir="$(mktemp -d)"
              cp -a "$artifact_dir"/. "$portable_dir"/
              : > "$portable_dir/portable.txt"
              tar -C "$portable_dir" -czf "release-assets/${artifact_name}-portable.tar.gz" .
              rm -rf "$portable_dir"
            fi
          done < <(find release-artifacts -mindepth 1 -maxdepth 1 -type d -print0)

          find release-assets -type f -print

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
          MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          set -euo pipefail

          release_name="${RELEASE_NAME:-$TAG_NAME}"

          args=("$TAG_NAME" --title "$release_name" --target "$GITHUB_SHA")
          if [[ "$DRAFT" == "true" ]]; then
            args+=(--draft)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          if [[ "$MAKE_LATEST" == "true" ]]; then
            args+=(--latest)
          else
            args+=(--latest=false)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "${args[@]}"
          else
            gh release create "${args[@]}" --notes "Manual release from workflow run ${GITHUB_RUN_NUMBER}."
          fi

          mapfile -t assets < <(find release-assets -type f | sort)
          gh release upload "$TAG_NAME" "${assets[@]}" --clobber
